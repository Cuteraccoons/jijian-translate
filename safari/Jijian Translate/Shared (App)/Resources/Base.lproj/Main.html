<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="极简翻译">
    <h1>极简翻译</h1>
    <p class="platform-ios">在“设置 → App → Safari 浏览器 → 扩展”中打开“极简翻译”，并允许它访问网站。之后在 Safari 地址栏点“页面菜单”即可使用网页翻译、沉浸阅读和查词。</p>
    <p class="platform-mac state-unknown">在 Safari 设置的“扩展”中打开“极简翻译”，并允许它访问网站。</p>
    <p class="platform-mac state-on">极简翻译已开启。可在 Safari 设置的“扩展”中管理网站权限或关闭它。</p>
    <p class="platform-mac state-off">极简翻译尚未开启。请在 Safari 设置的“扩展”中勾选它，并允许它访问网站。</p>
    <button class="platform-mac open-preferences">退出并打开 Safari 扩展设置…</button>
</body>
</html>
